{% extends "base.html" %}
{% block title %}{{ 'Edit Task' if task else 'New Task' }} — FlowPilot AI{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('tasks.list_tasks') }}" class="text-decoration-none small text-muted">
        <i class="bi bi-arrow-left me-1"></i> Back to All Tasks
    </a>
    <h2 class="h4 mt-1 mb-0 fw-bold">{{ 'Edit Task' if task else 'Create New Task' }}</h2>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold">Title *</label>
                    <input type="text" name="title" value="{{ task.title if task else '' }}" class="form-control" required maxlength="200">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description" rows="3" class="form-control">{{ task.description if task else '' }}</textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category" class="form-select">
                        {% for c in categories %}
                        <option value="{{ c }}" {% if task and task.category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Priority</label>
                    <select name="priority" class="form-select">
                        {% for p in priorities %}
                        <option value="{{ p }}" {% if (task and task.priority == p) or (not task and p == 'Medium') %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statuses %}
                        <option value="{{ s }}" {% if task and task.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Due Date</label>
                    <input type="date" name="due_date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Assigned To</label>
                    <input type="text" name="assigned_to" value="{{ task.assigned_to or '' if task else '' }}" class="form-control" placeholder="Person or team name">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Action Items (one per line)</label>
                    <textarea name="action_items" rows="4" class="form-control">{{ '\n'.join(task.action_items) if task else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> {{ 'Save Changes' if task else 'Create Task' }}
                </button>
                <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
